# NextGen Interiors — 301 redirects for duplicate URLs
#
# Generated from an audit of the live site. Every page below currently answers
# 200 at TWO addresses. The canonical tags already agree on which address is the
# real one, so Google will mostly consolidate them on its own — but two live
# copies still split crawl budget and can be indexed independently. A 301 makes
# it unambiguous.
#
# Nothing here has been applied. To use it on the VPS:
#
#   1. sudo nano /etc/nginx/sites-available/nextgen      (or whichever file
#                                                         holds the server{} block)
#   2. Paste the rules inside the existing `server { ... }` block that serves
#      nextgeninterior.com over 443.
#   3. sudo nginx -t          # must print "syntax is ok" and "test is successful"
#   4. sudo systemctl reload nginx
#
# Verify afterwards:
#   curl -sI https://nextgeninterior.com/blogs/banquet-designer-nepal | head -2
#   → expect "HTTP/2 301" and "location: https://nextgeninterior.com/banquet-designer-nepal"


# ---------------------------------------------------------------------------
# 1. Eight SEO landing pages live at both /<name> and /blogs/<name>.
#    The canonical on both copies points at the root URL, so /blogs/ redirects up.
# ---------------------------------------------------------------------------
location = /blogs/banquet-designer-nepal                      { return 301 /banquet-designer-nepal; }
location = /blogs/best-construction-company-nepal             { return 301 /best-construction-company-nepal; }
location = /blogs/best-home-designer-nepal                    { return 301 /best-home-designer-nepal; }
location = /blogs/classical-home-designer-nepal               { return 301 /classical-home-designer-nepal; }
location = /blogs/farmhouse-designer-nepal                    { return 301 /farmhouse-designer-nepal; }
location = /blogs/home-interior-residential-architecture-nepal { return 301 /home-interior-residential-architecture-nepal; }
location = /blogs/interior-architecture-design-construction-nepal { return 301 /interior-architecture-design-construction-nepal; }
location = /blogs/office-commercial-interior-design-nepal      { return 301 /office-commercial-interior-design-nepal; }
location = /blogs/mustang-hotel-designer-nepal                 { return 301 /mustang-hotel-designer-nepal; }
location = /blogs/shinta-mani-inspired-hotel-designer-nepal    { return 301 /shinta-mani-inspired-hotel-designer-nepal; }

# ---------------------------------------------------------------------------
# 2. Five location pages live at both /<name> and /locations/<name>.
#    Here the canonical points at the /locations/ copy, so the root copy
#    redirects down into the folder — the opposite direction to the block above.
# ---------------------------------------------------------------------------
location = /hotel-interior-design-surkhet      { return 301 /locations/hotel-interior-design-surkhet; }
location = /office-interior-design-lalitpur    { return 301 /locations/office-interior-design-lalitpur; }
location = /home-interior-design-bhaktapur     { return 301 /locations/home-interior-design-bhaktapur; }
location = /home-interior-design-chitwan       { return 301 /locations/home-interior-design-chitwan; }
location = /residential-architecture-dang      { return 301 /locations/residential-architecture-dang; }

# ---------------------------------------------------------------------------
# 3. Trailing-slash inconsistency: /blog answers 200 but /blog/ answers 404.
#    Anyone linking to the slashed form hits a dead page.
# ---------------------------------------------------------------------------
location = /blog/ { return 301 /blog; }

